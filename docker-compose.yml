services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_servicos
    environment:
      POSTGRES_DB: prestacao_servicos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - servicos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d prestacao_servicos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_servicos
    ports:
      - "6379:6379"
    networks:
      - servicos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_servicos
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: prestacao_servicos
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: 4Z^XrroxR@dWxqf$mTTKwW$!@#qGr4P
      JWT_EXPIRATION_HOURS: 24
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8080"
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@admin.com
      ADMIN_PASSWORD: abcd123456
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - servicos-net

volumes:
  pgdata:

networks:
  servicos-net:
    driver: bridge